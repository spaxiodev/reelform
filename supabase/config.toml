# Supabase CLI project config. Only the pieces we manage from the repo are
# listed; everything else stays whatever the dashboard says.
#
# Apply the email templates below to the hosted project with:
#
#   supabase login                      # the account that owns the project
#   supabase link --project-ref njjfdesmjbntccsjplnl
#   supabase config push
#
# The templates link to {{ .SiteURL }}/api/auth/callback, so the dashboard's
# Site URL (Authentication → URL Configuration) must be https://www.reelform.io
# and the redirect allow-list must include https://www.reelform.io/api/auth/callback
# (and the same on http://localhost:3000 for local work).

project_id = "njjfdesmjbntccsjplnl"

[auth.email.template.confirmation]
subject = "Confirm your Reelform account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Reelform password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Reelform sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new Reelform email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You've been invited to Reelform"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your Reelform verification code"
content_path = "./supabase/templates/reauthentication.html"
